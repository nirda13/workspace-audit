[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-audit"
version = "1.0.0"
description = "Code quality audit summaries for local development projects."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "nirda13"}]
dependencies = [
    "mcp>=1.28.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
workspace-audit = "workspace_audit.server:main"

[tool.setuptools.packages.find]
where = ["src"]
